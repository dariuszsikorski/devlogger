<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%97%89%3C/text%3E%3C/svg%3E" />
    <title>devlogger-viewer</title>
  </head>
  <body>
    <script>
      // FOUC guard: restore brightness + UI scale BEFORE first paint.
      // - Brightness writes --surface-base into <style id="theme-vars"> (themeStyle
      //   store re-uses this tag, so any !important fallback here is overridden
      //   cleanly by the runtime store after mount).
      // - UI scale writes a SEPARATE <style data-slot="scale"> tag with the
      //   discrete font-size (matches useScale.ts at runtime).
      (function () {
        var BASE_FONT_SIZE = 16;
        var DESKTOP_BREAKPOINT_PX = 960;
        var SCALE_ALLOWED = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
        var SCALE_KEY_DESKTOP = 'devlogger.viewer.scale:desktop';
        var SCALE_KEY_MOBILE  = 'devlogger.viewer.scale:mobile';

        var b = 0.18;
        var s = 1.0;
        try {
          var rawB = localStorage.getItem('devlogger.brightness');
          var parsedB = rawB === null ? b : parseFloat(rawB);
          if (parsedB >= 0.10 && parsedB <= 1.0) b = parsedB;
        } catch (e) { /* ignore */ }
        try {
          var key = window.innerWidth <= DESKTOP_BREAKPOINT_PX ? SCALE_KEY_MOBILE : SCALE_KEY_DESKTOP;
          var rawS = localStorage.getItem(key);
          if (rawS !== null) {
            var parsedS = parseFloat(rawS);
            if (SCALE_ALLOWED.indexOf(parsedS) !== -1) s = parsedS;
          }
        } catch (e) { /* ignore */ }

        // Brightness fallback - themeStyle store re-appends the same #theme-vars tag
        // post-mount and wins by source order without !important.
        var themeVars = document.createElement('style');
        themeVars.id = 'theme-vars';
        themeVars.textContent =
          ':root {\n' +
          '  --surface-base: oklch(' + b + ' 0.005 255) !important;\n' +
          '}';
        document.head.appendChild(themeVars);

        // UI scale - dedicated tag, no !important; useScale re-uses data-slot="scale".
        var scaleTag = document.createElement('style');
        scaleTag.setAttribute('data-slot', 'scale');
        scaleTag.textContent = ':root { font-size: ' + (BASE_FONT_SIZE * s) + 'px; }';
        document.head.appendChild(scaleTag);

        document.documentElement.classList.add(b < 0.67 ? 'theme-dark' : 'theme-light');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
